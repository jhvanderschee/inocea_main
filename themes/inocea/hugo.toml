# Eigen mounts, omdat het theme geen assets/-map heeft: static/ doet dubbel werk,
# zodat resources.Match "/img/icons/*.svg" (svg-sprite) ook vanuit themes/ werkt.
# Zodra je mounts declareert vervallen alle standaardmounts, dus staan ze hier allemaal.
[module]
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static"
    target = "assets"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "data"
    target = "data"
