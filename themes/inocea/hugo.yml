# Eigen mounts, want static/ dient ook als assets/ (svg-sprite via resources.Match)
module:
  mounts:
    - source: layouts
      target: layouts
    - source: static
      target: static
    - source: static
      target: assets
    - source: archetypes
      target: archetypes
    - source: i18n
      target: i18n
    - source: data
      target: data

# Sectie-regels voor alle sites: eerste match wint. Sites zetten zelf geen params.sections.
params:
  sections:
    # Format is CSS, first match wins
    - title: video-header
      has: video
      is: :first-child
    - title: image-header
      has: img
      is: :first-child
    - title: has-blocks
      has: ul.blocks
      is: 
    - title: has-counters
      has: ul.counters
      is: 
    - title: has-numbers
      has: ul.numbers
      is: 
    - title: has-facility
      has: .facility
      is: 
    - title: has-carousel
      has: .curtain-carousel
      is:
    - title: has-crafts
      has: .crafts
      is:
    - title: has-tabs
      has: div.tabs
      is:
    - title: has-accordion
      has: ul.accordion
      is:
    - title: leadership
      has: .leadership
      is: 
    - title: publications
      has: .publications
      is:
    - title: has-news
      has: ul.news
      is:
    - title: wide
      has: nav.pages
      is:
    - title: title-list-split
      has: h3:first-child, ul:nth-child(2), ul:last-child
      is:
    - title: has-outline
      has: .ship-outline
      is: 
    - title: text-and-video
      has: video, p
      is: 
    - title: intro
      has: h1
      is: :not(:first-child)
    - title: video
      has: video
      is: 
    - title: fullwidth-image
      has: img
      is: :not(:first-child)
