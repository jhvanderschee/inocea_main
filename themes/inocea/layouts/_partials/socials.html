<ul class="socials large">
   {{ range $key, $value := partial "data" "social_media" }}{{ if $value }}
        <li>
            <a target="_blank" rel="noopener" href="{{ $value }}" aria-label="{{ i18n "go_to" (dict "Name" ($key | humanize)) }}">{{ partial "svg" $key }}</a>
        </li>
   {{ end }}{{ end }}
</ul>
