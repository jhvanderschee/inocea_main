{{- /* Laatste posts als kaarten; {{< news 3 >}} toont er drie. */ -}}
{{ $posts := (where site.RegularPages "Section" "posts").ByDate.Reverse }}
{{ with .Get 0 }}{{ $posts = first (int .) $posts }}{{ end }}
<ul class="news">
    {{ range $posts }}
        {{ partial "news-item" . }}
    {{ end }}
</ul>
