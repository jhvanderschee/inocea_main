<ul class="publications">
    {{ range partial "data" "publications" }}
        <li>
          <h3 class='h4'>{{ .title }}</h3>
          {{ with .category }} <span>{{ . }}</span>{{ end }}
          {{ with .date }}<span>{{ (time .).Format (i18n "date_numeric") }}</span>{{ end }}
          {{ if .url }}
              <a target='_blank' rel='noopener' href="{{ .url }}" aria-label='{{ i18n "go_to_publication" (dict "Category" (string .category) "Title" .title) }}'></a>
          {{ end }}
        </li>
    {{ end }}
  </ul>
