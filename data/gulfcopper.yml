- title: New Construction
  image: /uploads/capabilites-01.png
  markdown: |
    - Purpose-built hulls and modules assembled under one roof, from first steel cut to sea trials.
    - The Arctic Security Cutter programme brings ice-class newbuild work to the Gulf Coast, backed by the shipyard infrastructure and trades already in place.
- title: Fabrication
  image: /uploads/capabilites-02b.png
  markdown: |
    - Structural steel, piping and outfitting packages built to drawing and delivered ready to install.
    - Plate shops, machine shops and blast-and-paint facilities work side by side, so a component never has to leave the yard between stages.
- title: Repair & Refurbishment
  image: /uploads/refurb-01.jpg
  markdown: |
    - Drydocking, steel renewal, machinery overhaul and voyage repair for tugs, barges, offshore units and government vessels.
    - Round-the-clock crews keep unplanned downtime short and scheduled dockings on their dates.
