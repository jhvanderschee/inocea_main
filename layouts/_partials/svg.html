{{- $id := . -}}
{{- $path := printf "static/img/icons/%s.svg" $id -}}
{{- $raw := readFile $path -}}
{{- $viewBox := replaceRE `(?s).*viewBox="([^"]+)".*` "$1" $raw -}}
<svg viewBox="{{ $viewBox }}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <use xlink:href="/img/xref.min.svg#{{ $id }}"></use>
</svg>
