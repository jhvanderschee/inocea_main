{{ with $crafts := site.Data.crafts }}
<div class="crafts">
    <div class="top">
        <ul class="tabs">
            {{ range $i, $craft := $crafts }}
                <li><button {{ if eq $i 0 }}class='active' {{ end }}data-for='{{ $i }}'>{{ .title }}</button></li>
            {{ end }}
        </ul>
        <div class="buttons outline">
            <button class='btn' data-dir='-1' aria-label='View previous craft'>{{ partial "render-svg" "/img/arrow-left.svg" }}</button>
            <button class='btn' data-dir='1' aria-label='View next craft'>{{ partial "render-svg" "/img/arrow-right.svg" }}</button>
        </div>
    </div>
    <ul class="images">
        {{ range $i, $craft := $crafts }}
            <li {{ if eq $i 0 }}class='active' {{ end }}data-for='{{ $i }}'>
                <h3 class='h6'>{{ .title }}</h3>
                {{ $image := partial "image" .image }}
                <picture>
                    <source media="(min-width:769px)" srcset="{{ .image }}">
                    <source media="(max-width:768px)" srcset="{{ $image }}">
                    <img alt="{{ .title }}" src="{{ .image }}">
                </picture>
            </li>
        {{ end }}
    </ul>
</div>
{{ end }}
