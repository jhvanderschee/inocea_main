- name: Mika Heiskanen
  image: /uploads/team/mikaheiskanen-7157-1.png
  function: CEO
  tel: ""
  textarea: Mika has 20 years of experience in the shipbuilding industry and has held
    senior leadership positions across ship design, production, newbuild programs
    and shipyard operations in Finland and internationally. He leads Helsinki Shipyard’s,
    Sata Shipbuilding’s and Inocea’s operations in Finland, with responsibility for
    operations and strategic growth across the organization.
- name: Ville Korpela
  image: /uploads/team/villekorpela-6803-2.png
  function: COO
  tel: ""
  textarea: Ville has more than 15 years of experience in naval architecture, ship
    design and shipbuilding, and has held technical, project management and commercial
    roles at Helsinki Shipyard. As COO, he leads operations across Helsinki Shipyard
    and Sata Shipbuilding.
- name: Jussi Lehtinen
  image: /uploads/team/jussilehtinen-7433-1.png
  function: Sales & Marketing
  tel: ""
  textarea: Jussi has 20 years of experience in the Finnish shipbuilding and maritime
    industry and has held project management, sales and leadership roles across newbuilding
    and marine technology businesses. He leads Helsinki Shipyard and Sata Shipbuilding’s
    shared sales organization, supporting the development and delivery of complex
    shipbuilding programs and customer projects.
- name: Anne Avento-Krapf
  image: /uploads/team/anneaventokrapt-6833-1.png
  function: People & Culture
  tel: ""
  textarea: Anne has extensive experience in human resources leadership across industrial
    environments in Finland and abroad and has led HR and HSE functions at Helsinki
    Shipyard since 2015. She oversees people, culture and organizational development,
    supporting Helsinki Shipyard’s and Sata Shipbuilding’s growth and workforce development.
- name: Petri Nousiainen
  image: /uploads/team/petrinousiainen-7194-1.png
  function: Strategic Planning
  tel: ""
  textarea: Petri has more than 20 years of experience at Helsinki Shipyard and has
    held project management and planning roles across complex shipbuilding programs.
    He leads strategic planning activities, overseeing project schedules, budgets
    and execution, and plays a key role in ensuring vessels are delivered on time
    and on budget in line with Helsinki Shipyard’s and Sata Shipbuilding’s commitment
    to customers.
- name: Minna Ilveskoski
  image: /uploads/team/minnailveskoski-7297-1.png
  function: CFO
  tel: ""
  textarea: Minna has extensive finance leadership experience in international industrial
    and project-based businesses and has held senior roles at Cargotec, ABB Marine,
    Evac Group and Norsepower. Throughout her career, she has built deep expertise
    in the maritime sector, supporting business growth, complex projects and strategic
    decision-making. She oversees Helsinki Shipyard’s and Sata Shipbuilding’s finance
    and reporting.
- name: Christel Nokkala
  image: /uploads/team/christelnokkala-7150-1-1.png
  function: Legal & Compliance
  tel: ""
  textarea: Christel has extensive experience in corporate law, M&A and complex commercial
    transactions. She leads the legal and compliance functions of Helsinki Shipyard
    and Sata Shipbuilding, with responsibility for legal, regulatory and corporate
    governance matters across the Finnish operations, supporting strategic development,
    major projects and business growth.
- name: Antti Leino
  image: /uploads/team/anttileino-7296-1.png
  function: Public Affairs & Communication
  tel: ""
  textarea: Antti has a background in public affairs, stakeholder engagement and public
    policy, and has held senior advisory and leadership roles across national and
    local government, labor market organizations and advocacy organizations. He leads
    public affairs and communications for Helsinki Shipyard and Sata Shipbuilding,
    working with key stakeholders and supporting the companies’ strategic priorities
    in Finland and internationally.
- name: Atte Leskinen
  image: /uploads/team/atteleskinen-7330-1.png
  function: Strategic Operations
  tel: ""
  textarea: Atte has a background in corporate strategy, business development and
    investor relations, and has worked across industrial and technology-driven businesses
    on large-scale transformation programs and strategy execution. He is responsible
    for strategic development and growth execution across Helsinki Shipyard’s and
    Sata Shipbuilding’s operations and acts as Chief of Staff to the CEO.
- name: 'Niko Suomela '
  image: /uploads/team/niko-suomela-2.png
  function: Integration
  tel: ""
  textarea: Niko has extensive leadership experience in industrial operations, organizational
    development and business transformation, and has led companies and teams through
    growth, integration and change across multiple industries. He leads business integration
    between Helsinki Shipyard and Sata Shipbuilding, with responsibility for strengthening
    collaboration, developing common processes and ways of working, and supporting
    the two shipyards in becoming a more unified and efficient organization.
