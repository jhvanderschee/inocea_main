visitors:
  title: Visitors
  inner_title: Planning a visit
  markdown: "Welcome to Helsinki Shipyard. Planning a visit? Please comply with the
    following safety instructions and register in advance. \n\n-\tAll visitors are
    required to complete safety training before arrival\n-\tRegister at the main gate
    (Laivakatu 1) and collect your visitor card and parking permit. \n-\tSecurity
    will notify your host of your arrival. Stay with your host throughout the visit.\n-\tUse
    marked routes only. Stay alert and keep clear of machinery. \n-\tUse the provided
    safety gear. Skirts, shorts, and high heels are not permitted in production areas.\n-\tPhotography
    is not allowed without permission.\n\nFor any questions, please contact your host.\nMain
    gate: [+358 10 622 2303](tel:+358106222303)  \nOperator: [+358 10 622 20](tel:+3581062220)
    \ \nEmergency: [+358 10 622 2222](tel:+358106222222)\n"
  cards:
  - title: Office visitors
    textarea: 'Required for visits to office spaces only. Valid for three months.
      Code: Meeting'
    button_text: Start training
    button_url: https://helsinkishipyard.flowlms.com/formalms/index.php?r=adm/homepage/register
  - title: Production visitors
    textarea: 'Required for visits to production areas. Valid for three months. Code:
      VISITOR'
    button_text: Start training
    button_url: https://helsinkishipyard.flowlms.com/formalms/index.php?r=adm/homepage/register
