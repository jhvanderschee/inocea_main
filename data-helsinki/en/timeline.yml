title: Milestones
big_title: A Legacy of Innovation
items:
- year: "2026"
  description: Start of construction of the Arctic Security Cutters, the first U.S.
    governmental vessels built outside the United States
- year: "2025"
  description: Start of construction of Polar Max, one of the world’s most powerful
    diesel-electric icebreakers
- year: "2021"
  description: Delivery of SH Minerva, an extremely high ice class (PC5) expedition
    cruise vessel for Antarctic operation
- year: "2016"
  description: 'Delivery of Polaris, the world’s first lower-emission diesel and LNG
    powered icebreaker '
- year: "2014"
  description: Delivery of the world’s first oblique icebreaker Baltika, an icebreaking
    emergency and rescue vessel
- year: "1998"
  description: Delivery of MS Elation, the world’s first cruise vessel with Azipod
    propulsion units
- year: "1990"
  description: The shipyard developed Azipod technology in collaboration with ABB
    and the Finnish National Board of Navigation
- year: "1988"
  description: Delivery of Taymyr, the world’s first nuclear icebreaker built outside
    Russia. The nuclear reactor was installed in St. Petersburg
- year: "1976"
  description: Delivery of Finnjet, the world’s largest and fastest passenger ferry,
    powered by gas turbines
- year: "1969"
  description: Delivery of MS Song of Norway for Royal Caribbean, the world’s largest
    and first purpose-built cruise vessel
- year: "1960"
  description: Delivery of Moskva, the world’s first diesel-electric heavy polar icebreaker
- year: "1954"
  description: Delivery of Voima, the world’s first four-screw diesel-electric icebreaker
