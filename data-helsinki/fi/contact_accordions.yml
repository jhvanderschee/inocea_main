visitors:
  title: Vierailijat
  inner_title: Tervetuloa Helsingin telakalle
  markdown: "Turvallisuuden varmistamiseksi edellytämme noudattamaan seuraavia ohjeita:\r\n\r\n-\tSuorita
    turvallisuusperehdytys etukäteen. \r\n-\tIlmoittaudu pääportilla (Laivakatu 1)
    ja nouda vierailijakorttisi ja pysäköintilupasi.\r\n-\tVartiointi ilmoittaa yhteyshenkilöllesi
    saapumisestasi. Pysy yhteyshenkilösi kanssa koko vierailun ajan.\r\n-\tKäytä vain
    merkittyjä jalankulkureittejä. Ole valppaana liikkuessasi alueella. \r\n-\tKäytä
    annettuja suojavarusteita. Hameet, shortsit ja korkokengät eivät ole sallittuja
    tuotantoalueilla.\r\n-\tValokuvaaminen on kielletty ilman lupaa.\r\n\r\nKysy tarvittaessa
    lisätietoja yhteyshenkilöltäsi.\r\n\r\nPääportti: [+358 10 622 2303](tel:+358106222303)
    \ \r\nVaihde: [+358 10 622 20](tel:+3581062220)  \r\nHätänumero: [+358 10 622
    2222](tel:+3580106222222)\r\n"
  cards:
  - title: Toimistossa vieraileville
    textarea: 'Turvallisuuskoulutus ainoastaan toimistossa vieraileville. Voimassa
