- name: Mika Heiskanen
  image: /uploads/mikaheiskanen-7157-1.png
  function: Toimitusjohtaja
  tel: ""
  textarea: Mikalla on 20 vuoden kokemus laivanrakennusteollisuudesta. Hän on toiminut
    johtotehtävissä laivasuunnittelun, tuotannon, uudisrakennusohjelmien ja telakkatoimintojen
    osa-alueilla Suomessa ja kansainvälisesti. Mika johtaa Helsinki Shipyardia, Sata
    Shipbuildingia ja Inocean toimintoja Suomessa vastaten organisaation operatiivisesta
    toiminnasta ja strategisesta kasvusta.
- name: Ville Korpela
  image: /uploads/team/villekorpela-6803-2.png
  function: Operatiivinen toiminta
  tel: ""
  textarea: Villellä on yli 15 vuoden kokemus laivanrakennusinsinöörinä laivojen suunnittelusta
    ja rakentamisesta. Hän on toiminut teknisissä, projektinjohdollisissa ja kaupallisissa
    tehtävissä Helsinki Shipyardilla. Operatiivisena johtajana hän johtaa Helsinki
    Shipyardin ja Sata Shipbuildingin toimintaa.
- name: Jussi Lehtinen
  image: /uploads/team/jussilehtinen-7433-1.png
  function: Myynti ja markkinointi
  tel: ""
  textarea: Jussilla on 20 vuoden kokemus suomalaisesta laivanrakennus- ja meriteollisuudesta.
    Hän on toiminut projektinjohdon, myynnin ja johtamisen tehtävissä uudisrakennus-
    ja meriteknologia-alan yrityksissä. Jussi johtaa Helsinki Shipyardin ja Sata Shipbuildingin
    yhteistä myyntiorganisaatiota ja tukee vaativien laivanrakennusohjelmien ja asiakasprojektien
    kehitystyötä ja toteutusta.
- name: Anne Avento-Krapf
  image: /uploads/team/anneaventokrapt-6833-1.png
  function: Henkilöstö ja kulttuuri
  tel: ""
  textarea: Annella on laaja kokemus henkilöstöjohtamisesta teollisissa toimintaympäristöissä
    Suomessa ja ulkomailla. Hän on johtanut Helsinki Shipyardin HR- ja HSE-toimintoja
    vuodesta 2015. Anne vastaa henkilöstöstä, kulttuurista ja organisaation kehittämisestä
    tukien Helsinki Shipyardin ja Sata Shipbuildingin kasvua ja henkilöstön osaamista.
- name: Petri Nousiainen
  image: /uploads/team/petrinousiainen-7194-1.png
  function: Strateginen suunnittelu
  tel: ""
  textarea: Petrillä on yli 20 vuoden kokemus Helsinki Shipyardilta. Hän on toiminut
    projektinjohdon ja suunnittelun tehtävissä vaativissa laivanrakennusohjelmissa.
    Petri johtaa strategisen suunnittelun toimintoja vastaten projektiaikatauluista,
    budjeteista ja toteutuksesta. Hän on osaltaan varmistamassa, että alukset toimitetaan
    ajallaan ja budjetissa Helsinki Shipyardin ja Sata Shipbuildingin asiakkaille
    antamien sitoumusten mukaisesti.
- name: Minna Ilveskoski
  image: /uploads/team/minnailveskoski-7297-1.png
  function: Talous
  tel: ""
  textarea: Minnalla on laaja kokemus talousjohtamisesta kansainvälisissä teollisissa
    ja projektipohjaisissa liiketoiminnoissa. Hän on toiminut johtavissa tehtävissä
    Cargotecilla, ABB Marinella, Evac Groupilla ja Norsepowerilla. Uransa aikana Minnalle
    on kertynyt syvällistä osaamista meriteollisuudesta sekä liiketoiminnan kasvun,
    vaativien projektien ja strategisen päätöksenteon tukemisesta. Hän vastaa Helsinki
    Shipyardin ja Sata Shipbuildingin taloudesta ja raportoinnista.
- name: Christel Nokkala
  image: /uploads/team/christelnokkala-7150-1-1.png
  function: 'Lakiasiat '
  tel: ""
  textarea: Christelillä on laaja kokemus yhtiöoikeudesta, yritysjärjestelyistä ja
    vaativista kaupallisista transaktioista. Hän johtaa Helsinki Shipyardin ja Sata
    Shipbuildingin lakiasia- ja compliance-toimintoja vastaten Suomen toimintojen
    oikeudellisista, sääntelyyn liittyvistä ja hallinnollisista asioista sekä tukien
    strategista kehitystä, merkittäviä projekteja ja liiketoiminnan kasvua.
- name: Antti Leino
  image: /uploads/team/anttileino-7296-1.png
  function: Yhteiskuntasuhteet ja viestintä
  tel: ""
  textarea: Antilla on tausta yhteiskuntasuhteissa, sidosryhmätyössä ja julkisessa
    päätöksenteossa. Hän on toiminut asiantuntija- ja johtotehtävissä valtakunnallisessa
    ja paikallishallinnossa, sekä työmarkkina- ja edunvalvontaorganisaatioissa. Hän
    johtaa Helsinki Shipyardin ja Sata Shipbuildingin yhteiskuntasuhteita ja viestintää,
    työskentelee keskeisten sidosryhmien kanssa ja tukee yhtiöiden strategisia tavoitteita
    Suomessa ja kansainvälisesti.
- name: Atte Leskinen
  image: /uploads/team/atteleskinen-7330-1.png
  function: Strategiset toiminnot
  tel: ""
  textarea: Atella on tausta yritysstrategiassa, liiketoiminnan kehittämisessä ja
    sijoittajasuhteissa. Hän on työskennellyt teollisissa ja teknologiavetoisissa
    liiketoiminnoissa laajojen muutosohjelmien ja strategian toimeenpanon parissa.
    Atte vastaa strategisesta kehittämisestä ja kasvun toteutuksesta Helsinki Shipyardin
    ja Sata Shipbuildingin toiminnoissa sekä toimii toimitusjohtajan Chief of Staffina.
- name: Niko Suomela
  image: /uploads/team/niko-suomela-2.png
  function: Integraatio
  tel: ""
  textarea: Nikolla on laaja johtamiskokemus teollisista toiminnoista, organisaation
    kehittämisestä ja liiketoiminnan muutoksesta. Hän on johtanut yrityksiä ja tiimejä
    kasvun, integraation ja muutoksen läpi useilla toimialoilla. Niko johtaa Helsinki
    Shipyardin ja Sata Shipbuildingin välistä liiketoimintaintegraatiota vastaten
    yhteistyön vahvistamisesta, yhteisten prosessien ja toimintatapojen kehittämisestä
    sekä yhtenäisen ja tehokkaan toimintamallin rakentamisesta kahden telakan välille.
