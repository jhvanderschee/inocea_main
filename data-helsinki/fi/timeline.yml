- year: "2021"
  description: SH Minervan luovutus. SH Minerva on erittäin korkean jääluokan (PC5)
    tutkimusristeilyalus Etelämantereen tutkimus- ja matkailukäyttöä varten
- year: "2016"
  description: Polaris-jäänmurtajan toimitus. Maailman ensimmäinen dieselillä ja LNG:llä
    toimiva jäänmurtaja vähentää päästöjä ja polttoaineenkulutusta
- year: "2014"
  description: Maailman ensimmäisen vinottain kulkevan jäänmurtajan, Baltikan, luovutus.
