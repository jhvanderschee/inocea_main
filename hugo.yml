title: SATA Shipbuilding
baseURL: https://www.satashipbuilding.com
assetDir: static

theme: inocea

params:
  # Merk-icoon boven de header op de homepage: de bestandsnaam (zonder .svg)
  # van een icoon in static/img/icons/. Weglaten = geen icoon.
  # header_icon: maple-leaf

  sections:
    # Format is CSS, first match wins
    - title: video-header
      has: video
      is: :first-child
    - title: image-header
      has: img
      is: :first-child
    - title: has-blocks
      has: ul.blocks
      is: 
    - title: has-counters
      has: ul.counters
      is: 
    - title: has-facility
      has: .facility
      is: 
    - title: has-carousel
      has: .curtain-carousel
      is:
    - title: has-crafts
      has: .crafts
      is:
    - title: has-tabs
      has: div.tabs
      is:
    - title: has-accordion
      has: ul.accordion
      is:
    - title: leadership
      has: .leadership
      is: 
    - title: publications
      has: .publications
      is:
    - title: title-list-split
      has: h3:first-child, ul:nth-child(2), ul:last-child
      is:
    - title: has-outline
      has: .ship-outline
      is: 
    - title: text-and-video
      has: video, p
      is: 
    - title: intro
      has: h1
      is: :not(:first-child)
    - title: video
      has: video
      is: 
    - title: fullwidth-image
      has: img
      is: :not(:first-child)

disableKinds:
  - taxonomy
  - term

permalinks:
  page:
    legal: /:contentbasename

outputs:
  home:
    - html
    - rss
    - json

markup:
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
    renderer:
      unsafe: true