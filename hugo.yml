title: SATA Shipbuilding
baseURL: https://www.satashipbuilding.com
assetDir: static

params:
  sections: 
    # Format is CSS, first match wins
    - title: video-header
      has: video
      is: :first-child
    - title: image-header
      has: img
      is: :first-child
    - title: has-blocks
      has: ul.blocks
      is: 
    - title: has-facility
      has: .facility
      is: 
    - title: has-carousel
      has: .curtain-carousel
      is: 
    - title: leadership
      has: .leadership
      is: 
    - title: intro
      has: h1
      is: :not(:first-child)
    - title: video
      has: video
      is: 
    - title: fullwidth-image
      has: img
      is: :not(:first-child)

disableKinds:
  - taxonomy
  - term

permalinks:
  page:
    legal: /:contentbasename

outputs:
  home:
    - html
    - rss
    - json

markup:
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
    renderer:
      unsafe: true