title: SATA Shipbuilding
baseURL: https://www.satashipbuilding.com
assetDir: static

theme: inocea

# Sectie-regels (params.sections) staan in het theme. Hier alleen site-params, bijv. een
# merk-icoon boven de homepage-header (bestandsnaam uit static/img/icons/, zonder .svg):
#   params:
#     header_icon: maple-leaf
params: {}

disableKinds:
  - taxonomy
  - term

permalinks:
  page:
    legal: /:contentbasename

outputs:
  home:
    - html
    - rss
    - json

markup:
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
    renderer:
      unsafe: true